<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stitch MCP — Interactive 3D Design DNA Dashboard</title>
  <meta name="description" content="A light-themed modern design system console integrated with Stitch MCP and Three.js 3D animated constellation rendering.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./styles.css">
  
  <!-- Three.js & OrbitControls via unpkg CDN -->
  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Decorative Premium Light Background Elements -->
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-primary"></div>
  <div class="bg-orb bg-orb-gold"></div>

  <!-- SPA Core Mounting Container -->
  <main id="app-mount">
    <!-- View components will be dynamically injected here -->
  </main>

  <!-- Global Action Notification Toast Alert -->
  <div class="toast" id="app-toast">
    <div class="toast-icon"></div>
    <div class="toast-text" style="font-size:0.85rem;font-weight:600;color:var(--text-main);"></div>
  </div>

  <!-- Main ES6 Modules Client Logic -->
  <script type="module" src="./app.js"></script>

</body>
</html>
